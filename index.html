<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/KIIT-Logo-500x500-1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />

    <!-- SEO -->
    <meta
      name="description"
      content="Browse upcoming events, register in one tap, and follow society announcements across KIIT University — all in one place."
    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Slack, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KIIT Events" />
    <meta
      property="og:title"
      content="KIIT Events — Browse, register, and follow campus events"
    />
    <meta
      property="og:description"
      content="Discover what's happening on campus, register for events in one tap, and follow society announcements — all in one place at KIIT University."
    />
    <meta property="og:url" content="https://kiitevents.netlify.app/" />
    <meta
      property="og:image"
      content="https://kiitevents.netlify.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="KIIT Events — discover and register for campus events"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="KIIT Events — Browse, register, and follow campus events"
    />
    <meta
      name="twitter:description"
      content="Discover what's happening on campus, register for events in one tap, and follow society announcements — all in one place at KIIT University."
    />
    <meta
      name="twitter:image"
      content="https://kiitevents.netlify.app/og-image.png"
    />

    <!-- Brand fonts: Inter for UI/body, Plus Jakarta Sans for display headings -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />

    <title>KIIT Events — Discover campus events</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
